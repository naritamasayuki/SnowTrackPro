# SwiftLint 静的解析ルール設定

included:
  - Packages/SnowTrackCore/Sources
  - Packages/SnowTrackCore/Tests
  - SnowTrackPro/SnowTrackPro

excluded:
  - .build
  - DerivedData

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - sorted_imports

disabled_rules:
  - trailing_whitespace

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 450

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - z
